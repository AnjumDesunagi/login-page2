<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login page</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: rgb(16, 16, 16);
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: #827d7d;
        border-radius: 8px;
        padding: 30px;
        width: 300px;
      }
      h1 {
        color: rgb(10, 9, 14);
        text-align: center;
        margin-bottom: 40px;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      input {
        margin-bottom: 20px;
        padding: 20px;
        border-radius: 5px;
        background-color: rgb(227, 203, 173);
      }
      button {
        background-color: rgb(56, 155, 236);
        padding: 15px;
        border-radius: 5px;
      }
      button:hover {
        background-color: rgb(34, 16, 224);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>login</h1>
      <form>
        <input type="email" name="id" placeholder="email" />
        <input type="email" name="id" placeholder="password" />
        <button type="submit">login</button>
      </form>
    </div>
  </body>
</html>
